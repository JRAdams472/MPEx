# Dev-only OIDC issuer for MPEx. Serves the admin UI's auth-code+PKCE flow
# and the service client's client-credentials grant (v2.46.0+ flag below).
# Production just repoints OIDC_ISSUER at the real IdP (LOLA OpenIddict / corporate).
issuer: http://localhost:5556/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

oauth2:
  skipApprovalScreen: true
  # client_credentials isn't in dex's default grant set — list it for the
  # service account. Also gated by clientCredentialsEnabled / the
  # DEX_CLIENT_CREDENTIAL_GRANT_ENABLED_BY_DEFAULT env var (dex >= v2.46.0).
  grantTypes: ["authorization_code", "refresh_token", "client_credentials"]
  clientCredentialsEnabled: true

logger:
  level: info
  format: json

enablePasswordDB: true
staticPasswords:
  # Dev credentials — password is the username + "123" (admin123 etc).
  - email: "admin@mpex.dev"
    hash: "$2b$10$erUgPFIRhvwgr1Q7hVUXt.2i5QLFL2ehOLtDkC1ZBdycAXIdMrjSS"
    username: "admin"
    userID: "admin-user"
  - email: "pricer@mpex.dev"
    hash: "$2b$10$HlGOcHTMdr9SfDSvGXcsq.Ff2ux5gpf32kJsGytulbKDCuBxsTcSq"
    username: "pricer"
    userID: "pricer-user"
  - email: "viewer@mpex.dev"
    hash: "$2b$10$Y55JS88WBjLVjZkYhCNFgeLjku8k.r4jtap3dtielQszVaIwEuy2u"
    username: "viewer"
    userID: "viewer-user"
  - email: "auditor@mpex.dev"
    hash: "$2b$10$kvU.BBHi/IsqEEiq6IZi1uGIN/vXAXj4bH10MWGxfbMiqWa1wkq3C"
    username: "auditor"
    userID: "auditor-user"

staticClients:
  - id: mpex-web
    name: "MPEx Admin UI"
    public: true
    redirectURIs:
      - http://localhost:3000/auth/callback
  - id: mpex-svc
    name: "MPEx service account"
    secretEnv: DEX_MPEX_SVC_SECRET
  # CI/admin automation identity — client-credentials mint for seeding and
  # tooling (aud-keyed role_grants give it 'admin' in the dev seed).
  - id: mpex-ci
    name: "MPEx CI/automation"
    secretEnv: DEX_MPEX_CI_SECRET
