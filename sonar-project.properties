sonar.projectKey=mpex
sonar.projectName=MPEx
# Scanner runs over the whole checkout; sources/tests scope the analysis.
# No Rust analyzer in Community Build — src/ indexes for metrics and
# duplication only; the TypeScript/JS analysis is fully native.
sonar.sources=src,clients/web/app,clients/web/components,clients/web/lib,migrations,seed,dex
sonar.tests=tests,clients/web/__tests__,clients/web/e2e
sonar.exclusions=**/node_modules/**,**/target/**,**/*.test.ts,**/*.spec.ts
sonar.javascript.lcov.reportPaths=clients/web/coverage/lcov.info
# testkit.rs embeds an intentional test-only RSA key (documented: guards
# nothing, never a real issuer) — suppress the secrets rule for it durably
# (UI "won't fix" doesn't persist into ephemeral CI scans).
sonar.issue.ignore.multicriteria=1
sonar.issue.ignore.multicriteria.1.ruleKey=secrets:S6706
sonar.issue.ignore.multicriteria.1.resourceKey=src/auth/testkit.rs
