sonar.projectKey=mpex
sonar.projectName=MPEx
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.exclusions=**/node_modules/**,**/target/**,**/.next/**,**/coverage/**,**/dist/**,**/out/**,**/playwright-report/**,**/test-results/**,**/package-lock.json,**/Cargo.lock

sonar.tests=clients/web/__tests__,clients/web/e2e,tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts

sonar.javascript.lcov.reportPaths=clients/web/coverage/lcov.info
