[package]
name = "mpex"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures = "0.3"
opentelemetry = "0.33"
opentelemetry-appender-tracing = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = [
    "grpc-tonic",
    "http-proto",
    "hyper-client",
    "trace",
    "logs",
] }
opentelemetry_sdk = { version = "0.33", features = [
    "rt-tokio",
    "logs",
    "experimental_logs_batch_log_processor_with_async_runtime",
] }
# aws_lc_rs backend: already in the tree via reqwest/rustls — keeps the JWT
# crypto provider unambiguous and adds no new native deps.
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
zen-engine = "2"
zen-expression = "2"
governor = { version = "0.10.4", features = ["dashmap"] }
regex = "1.13.1"

[dev-dependencies]
base64 = "0.22"
tower = { version = "0.5", features = ["util"] }
