services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: mpex
      POSTGRES_PASSWORD: mpex
      POSTGRES_DB: mpex
    ports:
      - "5432:5432"
    volumes:
      # postgres:18+ wants the mount at /var/lib/postgresql (PGDATA lives in ./data)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpex -d mpex"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    environment:
      DATABASE_URL: postgres://mpex:mpex@db:5432/mpex
      PORT: "8080"
      RUST_LOG: info,mpex=debug,tower_http=info
      CORS_ORIGIN: http://localhost:3000
      RUN_SEED: "1"
      SEED_DIR: /seed
      # OIDC resource-server config. Tokens carry iss=http://localhost:5556/dex
      # (what the browser sees); JWKS is fetched over the docker network.
      OIDC_ISSUER: http://localhost:5556/dex
      # Dex stamps aud=client_id: mpex-web (UI), mpex-svc (svc), mpex-ci (automation).
      OIDC_AUDIENCE: mpex-api,mpex-web,mpex-svc,mpex-ci
      OIDC_JWKS_URL: http://dex:5556/dex/keys
      # Observability exporters (both optional; unset = stdout JSON only).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      SEQ_URL: http://seq/ingest/otlp/v1/logs
      # SEQ_API_KEY: ""   # set when Seq ingest auth is configured
    volumes:
      - ./seed:/seed:ro
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      dex:
        condition: service_started

  dex:
    # Dev IdP — auth-code+PKCE for the admin UI, client-credentials for
    # service accounts. Requires v2.46.0+ for the clientCredentialsEnabled flag.
    image: dexidp/dex:v2.46.0
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    environment:
      DEX_MPEX_SVC_SECRET: ${DEX_MPEX_SVC_SECRET:-mpex-svc-dev-secret}
      DEX_MPEX_CI_SECRET: ${DEX_MPEX_CI_SECRET:-mpex-ci-dev-secret}
      DEX_CLIENT_CREDENTIAL_GRANT_ENABLED_BY_DEFAULT: "true"
    volumes:
      - ./dex/config.dev.yaml:/etc/dex/config.yaml:ro
    ports:
      - "5556:5556"

  web:
    build: clients/web
    environment:
      # BFF proxy target (docker-network internal) — browser never sees it.
      API_URL: http://api:8080
      # Browser-facing issuer for login redirects; token exchange goes over
      # the docker network to the dex container.
      OIDC_ISSUER: http://localhost:5556/dex
      OIDC_TOKEN_URL: http://dex:5556/dex/token
      OIDC_CLIENT_ID: mpex-web
      OIDC_REDIRECT_URI: http://localhost:3000/auth/callback
      SESSION_SECRET: mpex-dev-session-secret-change-me
    ports:
      - "3000:3000"
    depends_on:
      - api
      - dex

  seq:
    image: datalust/seq:2025.2
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true" # local dev only — no UI/ingest auth
    ports:
      - "5341:80"   # UI + ingest
    volumes:
      - seqdata:/seq/data

  jaeger:
    image: jaegertracing/jaeger:2.13.0
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP

volumes:
  pgdata:
  seqdata:
