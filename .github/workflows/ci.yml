name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust — fmt / clippy / test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mpex
          POSTGRES_PASSWORD: pg-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: mpex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mpex -d mpex"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgres://mpex:pg-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/mpex
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  web:
    name: Web — lint / typecheck / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run build

  gitleaks:
    name: gitleaks — secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  deps:
    name: Deps — cargo audit + npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # audit-check publishes findings as a check run; without this the job
      # fails post-audit with "Resource not accessible by integration" on
      # push events.
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - run: npm ci
        working-directory: clients/web
      # Filtered audit gate: fails on un-excepted high/critical advisories in
      # production deps; dev findings are report-only. Exceptions live in
      # clients/web/npm-audit-exceptions.json with justification + review
      # triggers — see scripts/audit.mjs.
      - run: npm run audit:gate
        working-directory: clients/web

  e2e:
    name: E2E — Playwright (seeded stack)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: mpex
          POSTGRES_PASSWORD: pg-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: mpex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mpex -d mpex"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      DATABASE_URL: postgres://mpex:pg-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/mpex
      # Baked into the client bundle at `next build` time.
      NEXT_PUBLIC_API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - name: Start Dex (dev IdP)
        run: |
          # Client secrets are generated per run — no static secret values
          # live in tracked files. Exported for the seed step below.
          SVC_SECRET=$(openssl rand -hex 16)
          CI_SECRET=$(openssl rand -hex 16)
          echo "DEX_MPEX_SVC_SECRET=$SVC_SECRET" >> "$GITHUB_ENV"
          echo "DEX_MPEX_CI_SECRET=$CI_SECRET" >> "$GITHUB_ENV"
          docker run -d --name dex -p 5556:5556 \
            -v "$PWD/dex/config.dev.yaml:/etc/dex/config.yaml" \
            -e "DEX_MPEX_SVC_SECRET=$SVC_SECRET" \
            -e "DEX_MPEX_CI_SECRET=$CI_SECRET" \
            dexidp/dex:v2.46.0 dex serve /etc/dex/config.yaml
          for i in $(seq 1 30); do
            curl -sf http://localhost:5556/dex/.well-known/openid-configuration >/dev/null && exit 0 || sleep 1
          done
          echo "Dex did not come up"; exit 1
      - name: Start API (seeded)
        run: |
          RUN_SEED=1 \
          OIDC_ISSUER=http://localhost:5556/dex \
          OIDC_AUDIENCE=mpex-api,mpex-web,mpex-svc,mpex-ci \
          ./target/debug/mpex &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/healthz && exit 0 || sleep 1
          done
          echo "API did not come up"; exit 1
      # The SQL seed covers products + decisions only; create the matrix and
      # rate sheet through the API (same path the UI uses) so the sandbox
      # specs have a real pricing waterfall to assert on. Mutation routes are
      # admin-gated — mint an mpex-ci client-credentials token for the calls.
      - name: Seed demo artifacts + publish
        run: |
          TOKEN=$(curl -sf -X POST http://localhost:5556/dex/token \
            -u "mpex-ci:$DEX_MPEX_CI_SECRET" \
            -d "grant_type=client_credentials&scope=openid" | jq -r .access_token)
          curl -sf -X PUT http://localhost:8080/api/matrices/llpa.fico-ltv \
            -H "authorization: Bearer $TOKEN" \
            -H 'content-type: application/json' -d '{
              "spec": {
                "rows": [{"id":"hi","expr":"borrower.creditScore >= 740"},{"id":"mid","expr":"borrower.creditScore >= 700"}],
                "cols": [{"id":"ltv80","expr":"loan.ltv <= 80"},{"id":"ltv90","expr":"loan.ltv <= 90"}],
                "cells": {"hi:ltv80":-0.25,"hi:ltv90":0.0,"mid:ltv80":-0.125,"mid:ltv90":0.25},
                "op": "sum"
              }
            }' >/dev/null
          curl -sf -X PUT http://localhost:8080/api/rate-sheets/CONV30 \
            -H "authorization: Bearer $TOKEN" \
            -H 'content-type: application/json' -d '{
              "spec": {
                "rates": [6.25, 6.5, 6.75],
                "lockTerms": [30, 45, 60],
                "prices": {
                  "6.25:30":100.375,"6.25:45":100.125,"6.25:60":99.875,
                  "6.5:30":100.0,"6.5:45":99.75,"6.5:60":99.5,
                  "6.75:30":99.5,"6.75:45":99.25,"6.75:60":99.125
                }
              }
            }' >/dev/null
          curl -sf -X POST http://localhost:8080/api/publications \
            -H "authorization: Bearer $TOKEN" \
            -H 'content-type: application/json' -d '{"label":"e2e-seed"}' >/dev/null
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('clients/web/package-lock.json') }}
      - run: npm ci
        working-directory: clients/web
      - run: npm run build
        working-directory: clients/web
      - name: Start web
        env:
          API_URL: http://localhost:8080
          OIDC_ISSUER: http://localhost:5556/dex
          OIDC_TOKEN_URL: http://localhost:5556/dex/token
          OIDC_CLIENT_ID: mpex-web
          OIDC_REDIRECT_URI: http://localhost:3000/auth/callback
          SESSION_SECRET: e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          npm start &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000 >/dev/null && exit 0 || sleep 1
          done
          echo "Web did not come up"; exit 1
        working-directory: clients/web
      - run: npx playwright install --with-deps chromium
        working-directory: clients/web
      - run: npx playwright test
        working-directory: clients/web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: clients/web/playwright-report
          retention-days: 7

  sonarqube:
    name: SonarQube — scan + quality gate
    needs: [rust, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # blame + new-code detection need history
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      # Jest coverage feeds sonar.javascript.lcov.reportPaths.
      - run: npm ci && npm test -- --ci --coverage
        working-directory: clients/web
      - name: Start SonarQube
        # Ephemeral community-build instance inside the job — same pattern
        # as the local docker-compose.sonarqube.yml overlay.
        run: |
          docker run -d --name sonarqube -p 9000:9000 \
            -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
            sonarqube:community
          for i in $(seq 1 90); do
            s=$(curl -sf http://localhost:9000/api/system/status | grep -o '"status":"[A-Z_]*"' | cut -d'"' -f4 || true)
            [ "$s" = "UP" ] && exit 0
            [ "$s" = "DOWN" -o "$s" = "DB_MIGRATION_NEEDED" ] && { docker logs sonarqube --tail 50; exit 1; }
            sleep 4
          done
          docker logs sonarqube --tail 80; exit 1
      - name: Scanner token + scan + quality gate
        env:
          # Default admin cred for the ephemeral in-CI instance only — the
          # generated token dies with the container.
          SONAR_ADMIN_CRED: admin:admin
        run: |
          token=$(curl -sf -u "$SONAR_ADMIN_CRED" \
            -X POST http://localhost:9000/api/user_tokens/generate?name=ci \
            | grep -o '"token":"[^"]*"' | cut -d'"' -f4)
          [ -n "$token" ] || { echo "token generation failed"; exit 1; }
          docker run --rm --network host \
            -e SONAR_TOKEN=$token \
            -e SONAR_HOST_URL=http://localhost:9000 \
            -v "$PWD:/usr/src" \
            sonarsource/sonar-scanner-cli \
            -Dsonar.qualitygate.wait=true
